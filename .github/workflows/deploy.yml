name: CI/CD Docker Apache2 to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: akshay0131
          password: dckr_pat_z6aXoqzjRfQ1wdAi7gZqRrQU3zs

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: akshay0131/apache-web:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: 13.55.71.198
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull akshay0131/apache-web:latest
            sudo docker stop apache-app || true
            sudo docker rm apache-app || true
            sudo docker run -d -p 8085:80 --name apache-app akshay0131/apache-web:latest
